    <meta name="theme-color" content="#ffffff" />
    <script>
      // Sets the theme before the first paint: the reader's own choice if they made one, otherwise
      // what their system asks for. src/theme/ThemeProvider.tsx makes the same choice and takes over.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('webbrother:theme');
        } catch (error) {
          // Storage is unavailable: follow the system.
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').content = '#0c1218';
      })();
    </script>
